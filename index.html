
<!DOCTYPE html>
<html>
<head>
    <title>Swiggy Home Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Swiggy</h1>
    <div>
        <button>Login</button>
        <button>Sign Up</button>
    </div>
</header>

<main>
    <h1>Hungry?</h1>
    <h2>Order food from your favourite restaurants.</h2>

    <input type="text" placeholder="Enter your location">
    <button>Find Food</button>

    <h2>What's on your mind?</h2>

    <div class="cards">
        <div class="card">🍕 Pizza</div>
        <div class="card">🍔 Burger</div>
        <div class="card">🍜 Noodles</div>
        <div class="card">🍰 Cake</div>
    </div>

    <h2>Popular Restaurants</h2>

    <div class="cards">
        <div class="card">Pizza Palace<br>⭐ 4.2</div>
        <div class="card">Burger House<br>⭐ 4.5</div>
        <div class="card">Spicy Kitchen<br>⭐ 4.1</div>
    </div>
</main>

</body>
</html>
